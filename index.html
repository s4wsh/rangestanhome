<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رنگستان | آرامش دیوار</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top-header">
    <div class="container header-inner">
      <img src="images/logo/logomark-dark.png" alt="رنگستان" class="header-logo">
    </div>
  </header>

  <main>
    <section class="minimal-hero">
      <div class="container minimal-inner">
        <div class="minimal-copy">
          <p class="minimal-line">رنگستان به خلق فضاهایی می‌اندیشد که نور، سکون و نظم در آن‌ها جریان دارد.</p>
          <p class="minimal-line">ما باور داریم هر خانه باید آرامش خود را باز یابد؛</p>
          <p class="minimal-line">از دلِ ترمیم دقیق تا رنگ‌آمیزی آراسته و طراحی سه‌بعدی،</p>
          <p class="minimal-line">هدف ما ساختن فضاهاییست که بین درون و بیرون آشتی برقرار کنند</p>
          <p class="minimal-line">و زیباییِ ماندگار را با سادگی ایرانی پیوند دهند.</p>
        </div>
        <div class="minimal-visual">
          <img src="images/gallery/hero-image.jpg" alt="نمونه اجرای رنگستان">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
