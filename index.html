<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رنگستان | نقاشی تخصصی دیوار</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bar-h: 40px;
    --header-gap: 8px;
    --header-h: 72px;
    --main-pt: calc(var(--bar-h) + var(--header-gap) + var(--header-h));
  }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #f7f4ec, #ede7d7);
  }

  .hide { transform: translateY(-130%); }
  .show { transform: translateY(0); }
  #topBar, #headerBar { transition: transform .35s ease; }

  /* Slider styles */
  .slider {
    width: 100%;
    overflow: hidden;
    position: relative;
    border-radius: 18px;
  }
  .slides {
    display: flex;
    transition: transform 0.6s ease-in-out;
  }
  .slide {
    min-width: 100%;
    border-radius: 18px;
  }
  .dots span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ccc;
    display: inline-block;
    transition: 0.3s;
  }
  .dots span.active {
    background: #000;
  }
</style>

</head>
<body class="min-h-screen overflow-x-hidden">

  <div id="topBar"
    class="w-full fixed top-0 right-0 left-0 bg-black text-white z-50 flex items-center justify-center text-[13px] border-b border-black/15 show"
    style="height: var(--bar-h);">
    <span class="font-semibold whitespace-nowrap">📞 تماس مستقیم: ۰۹۱۹۱۹۹۶۶۰۸</span>
  </div>

  <header id="headerBar"
    class="fixed w-full right-0 left-0 z-40 px-4 show bg-white/90 backdrop-blur-md rounded-b-3xl shadow-lg border-[4px] border-black/10 flex justify-center"
    style="top: calc(var(--bar-h) + var(--header-gap)); height: var(--header-h);">
    <div class="max-w-[1100px] w-full flex justify-center items-center">
      <img src="images/logo/logomark-dark.png" class="h-9" alt="رنگستان">
    </div>
  </header>

  <main id="mainContent" class="transition-all pb-28" style="padding-top: var(--main-pt);">
    <section class="max-w-[1100px] mx-auto px-4 flex flex-col gap-8">

      <!-- Hero + About + Service Cards remain unchanged -->
      <!-- ... YOUR EXISTING SECTIONS ... -->

      <a href="https://wa.me/989191996608"
        class="bg-white/90 backdrop-blur-md rounded-3xl shadow-lg border-[4px] border-black/10 flex items-center justify-center gap-3 p-4 font-bold text-green-700 hover:bg-white transition">
        💬 پیش‌نمایش سریع — پیام در واتساپ
      </a>

      <!-- 🖼️ Modern Auto Gallery Slider -->
      <div class="bg-white/85 backdrop-blur-sm rounded-3xl p-4 shadow-xl border border-black/5">
        <div class="slider">
          <div class="slides" id="slides">
            <img src="images/gallery/gal1.jpg" class="slide object-cover md:h-[420px]" alt="">
            <img src="images/gallery/gal2.jpg" class="slide object-cover md:h-[420px]" alt="">
            <img src="images/gallery/gal3.jpg" class="slide object-cover md:h-[420px]" alt="">
            <img src="images/gallery/gal4.jpg" class="slide object-cover md:h-[420px]" alt="">
          </div>
        </div>

        <div class="dots flex justify-center gap-2 mt-3" id="dots">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

    </section>
  </main>

  <script>
    let lastScroll = 0;
    const topBar = document.getElementById("topBar");
    const headerBar = document.getElementById("headerBar");

    window.addEventListener("scroll", () => {
      const current = window.pageYOffset;
      if (current > lastScroll && current > 60) {
        topBar.classList.replace("show", "hide");
        headerBar.classList.replace("show", "hide");
      } else {
        topBar.classList.replace("hide", "show");
        headerBar.classList.replace("hide", "show");
      }
      lastScroll = Math.max(current, 0);
    });


    /* ⭐ Auto & Manual Slider */
    const slides = document.getElementById("slides");
    const dots = document.querySelectorAll("#dots span");
    let index = 0;

    function showSlide(i) {
      index = i;
      slides.style.transform = `translateX(-${i * 100}%)`;
      dots.forEach((dot, d) => dot.classList.toggle("active", d === i));
    }

    dots.forEach((dot, i) => dot.addEventListener("click", () => showSlide(i)));

    setInterval(() => {
      index = (index + 1) % dots.length;
      showSlide(index);
    }, 5000);

    showSlide(0);
  </script>

</body>
</html>
