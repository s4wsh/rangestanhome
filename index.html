<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رنگستان | نقاشی تخصصی دیوار</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bar-h: 40px;
    --header-gap: 8px;
    --header-h: 72px;
    --main-pt: calc(var(--bar-h) + var(--header-gap) + var(--header-h));
  }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #f7f4ec, #ede7d7);
  }

  .hide { transform: translateY(-130%); }
  .show { transform: translateY(0); }
  #topBar, #headerBar { transition: transform .35s ease; }

  /* === Rangestan gallery styles === */
  :root {
    --rg-bg: #f7f4ec;
    --rg-ink: #121110;
    --rg-muted: #7a746c;
    --rg-radius: 22px;
    --rg-shadow: 0 22px 60px rgba(0,0,0,0.13);
  }

  .rg-gallery-shell {
    max-width: 1100px;
    margin: 0 auto;
  }

  .rg-gallery-header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 8px;
  }

  .rg-toggle-btn {
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.9);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.8rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--rg-muted);
    transition: background .2s ease, transform .1s ease;
    backdrop-filter: blur(6px);
  }

  .rg-toggle-btn.rg-active {
    color: var(--rg-ink);
    background: #eee6d8;
  }

  .rg-slider {
    position: relative;
    overflow: hidden;
    border-radius: var(--rg-radius);
    box-shadow: var(--rg-shadow);
    background: #000;
    aspect-ratio: 16/10;
  }

  .rg-slider-track {
    display: flex;
    transition: transform 0.7s cubic-bezier(.18,.77,.45,1);
  }

  .rg-slide {
    min-width: 100%;
  }

  .rg-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  .rg-slider-arrow {
    position: absolute;
    top: 50%;
    width: 36px;
    height: 36px;
    background: rgba(0,0,0,.4);
    color: #fff;
    border-radius: 999px;
    display: grid;
    place-content: center;
    transform: translateY(-50%);
    cursor: pointer;
    border: none;
  }

  .rg-slider-arrow.rg-prev { left: 8px; }
  .rg-slider-arrow.rg-next { right: 8px; }

  .rg-slider-dots {
    text-align: center;
    padding-top: 10px;
  }

  .rg-slider-dot {
    width: 9px;
    height: 9px;
    background: rgba(0,0,0,0.25);
    border-radius: 999px;
    display: inline-block;
    margin: 4px;
  }

  .rg-slider-dot.rg-active {
    width: 18px;
    background: rgba(0,0,0,0.75);
  }

  .rg-grid-view {
    margin-top: 18px;
  }

  .rg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .rg-grid-item {
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0,0,0,.08);
  }

  .rg-grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .rg-hidden { display: none; }
</style>
</head>

<body class="min-h-screen overflow-x-hidden">

<div id="topBar"
  class="w-full fixed top-0 right-0 left-0 bg-black text-white z-50 flex items-center justify-center text-[13px] show"
  style="height: var(--bar-h);">
  📞 تماس مستقیم: ۰۹۱۹۱۹۹۶۶۰۸
</div>

<header id="headerBar"
  class="fixed w-full right-0 left-0 z-40 px-4 show bg-white/90 backdrop-blur-md rounded-b-3xl shadow-lg border-[4px] border-black/10 flex justify-center"
  style="top: calc(var(--bar-h) + var(--header-gap)); height: var(--header-h);">
  <img src="images/logo/logomark-dark.png" class="h-9" alt="رنگستان">
</header>

<main id="mainContent" class="pb-24" style="padding-top: var(--main-pt);">
<section class="max-w-[1100px] mx-auto px-4 flex flex-col gap-8">

  <!-- WhatsApp CTA stays -->
  <a href="https://wa.me/989191996608"
    class="bg-white/90 backdrop-blur-md rounded-3xl shadow-lg border-[4px] border-black/10 flex items-center justify-center gap-3 p-4 font-bold text-green-700 hover:bg-white transition mt-6">
    💬 پیش‌نمایش سریع — پیام در واتساپ
  </a>

  <!-- === Gallery ONLY === -->
  <section class="rg-gallery-shell">

    <div class="rg-gallery-header">
      <button class="rg-toggle-btn" id="rgToggleBtn">
        <span>نمایش شبکه‌ای</span>
      </button>
    </div>

    <div class="rg-slider-view" id="rgSliderView">
      <div class="rg-slider" id="rgSlider">
        <button class="rg-slider-arrow rg-prev">&#10094;</button>
        <button class="rg-slider-arrow rg-next">&#10095;</button>
        <div class="rg-slider-track" id="rgSliderTrack">
          <div class="rg-slide"><img src="images/gallery/IMG_8873.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/fourth.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/hero-image.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/img.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/mm.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/teamwork-copy.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/tree.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/god.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/sal.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/mus.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/third.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/to-fix.jpg" /></div>
          <div class="rg-slide"><img src="images/gallery/wall-painting.jpg" /></div>
        </div>
      </div>
      <div class="rg-slider-dots" id="rgSliderDots"></div>
    </div>

    <div class="rg-grid-view rg-hidden" id="rgGridView">
      <div class="rg-grid" id="rgGridContainer"></div>
    </div>

  </section>

</section>
</main>

<script>
(function() {
  const slider=document.getElementById("rgSlider");
  const track=document.getElementById("rgSliderTrack");
  const slides=[...track.children];
  const dotsContainer=document.getElementById("rgSliderDots");
  const gridContainer=document.getElementById("rgGridContainer");
  const toggle=document.getElementById("rgToggleBtn");
  const sliderView=document.getElementById("rgSliderView");
  const gridView=document.getElementById("rgGridView");

  let index=0,auto;

  slides.forEach((s,i)=>{
    let d=document.createElement("span");
    d.className="rg-slider-dot"+(i===0?" rg-active":"");
    d.onclick=()=>go(i);
    dotsContainer.appendChild(d);

    let g=document.createElement("button");
    g.className="rg-grid-item";
    g.onclick=()=>{go(i);sliderView.classList.remove("rg-hidden");gridView.classList.add("rg-hidden");toggle.classList.remove("rg-active")};
    let im=s.children[0].cloneNode(true);
    g.appendChild(im);
    gridContainer.appendChild(g);
  });
  const dots=[...dotsContainer.children];

  function go(i){
    index=(i+slides.length)%slides.length;
    track.style.transform=`translateX(-${index*100}%)`;
    dots.forEach((d,n)=>d.classList.toggle("rg-active",n===index));
  }

  document.querySelector(".rg-prev").onclick=()=>{go(index-1)};
  document.querySelector(".rg-next").onclick=()=>{go(index+1)};

  toggle.onclick=()=>{
    let gridOn=!gridView.classList.contains("rg-hidden");
    if(gridOn){ sliderView.classList.remove("rg-hidden");gridView.classList.add("rg-hidden");toggle.classList.remove("rg-active") }
    else { sliderView.classList.add("rg-hidden");gridView.classList.remove("rg-hidden");toggle.classList.add("rg-active") }
  };

  go(0);
})();
</script>

<script>
let lastScroll=0,topBar=document.getElementById("topBar"),header=document.getElementById("headerBar");
window.addEventListener("scroll",()=>{
  let y=window.pageYOffset;
  if(y>lastScroll&&y>60){topBar.classList.replace("show","hide");header.classList.replace("show","hide")}
  else{topBar.classList.replace("hide","show");header.classList.replace("hide","show")}
  lastScroll=y;
});
</script>
</body>
</html>
